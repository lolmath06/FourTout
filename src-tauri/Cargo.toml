[package]
name = "fourtout"
version = "0.1.0"
description = "FourTout — boîte à outils desktop locale"
authors = ["FourTout"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Le suffixe `_lib` évite un conflit de noms avec le binaire sous Windows.
name = "fourtout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
md-5 = "0.10.6"
sha2 = "0.10.9"
aes = "0.8.4"
rayon = "1.10.0"
flate2 = "1.1.10"
num_cpus = "1.17.0"

[profile.release]
# Application distribuée : on privilégie la taille du binaire.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package]
name = "fourtout"
version = "0.1.0"
description = "FourTout — boîte à outils desktop locale"
authors = ["FourTout"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Le suffixe `_lib` évite un conflit de noms avec le binaire sous Windows.
name = "fourtout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Application distribuée : on privilégie la taille du binaire.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package]
name = "fourtout"
version = "0.1.0"
description = "FourTout — boîte à outils desktop locale"
authors = ["FourTout"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Le suffixe `_lib` évite un conflit de noms avec le binaire sous Windows.
name = "fourtout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
md-5 = "0.10.6"
sha2 = "0.10.9"
aes = "0.8.4"
rayon = "1.10.0"
flate2 = "1.1.10"
num_cpus = "1.17.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Installation des moteurs de parole : téléchargement vérifié puis extraction.
ureq = "2.12"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Arbitrage des permissions de la WebView (microphone). La version est figée sur
# celle de wry : c'est la même WebView qui est manipulée.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[profile.release]
# Application distribuée : on privilégie la taille du binaire.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
